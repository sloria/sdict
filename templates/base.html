<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#111111" media="(prefers-color-scheme: dark)" />
    <title>{% block title %}sdict{% endblock %}</title>
    <link rel="icon" href="/static/favicon.ico" sizes="any" />
    <link rel="icon" href="/static/logo.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/static/apple-touch-icon.png" />
    <link rel="manifest" href="/static/site.webmanifest" />
    <style>
      /* https://cube.fyi */

      @font-face {
        font-family: Alegreya;
        font-style: italic;
        font-weight: 400;
        font-display: swap;
        src: url(/static/fonts/alegreya-latin-400-italic.woff2) format("woff2");
      }
      @font-face {
        font-family: Alegreya;
        font-style: normal;
        font-weight: 400;
        font-display: swap;
        src: url(/static/fonts/alegreya-latin-400-normal.woff2) format("woff2");
      }
      @font-face {
        font-family: Alegreya;
        font-style: normal;
        font-weight: 500;
        font-display: swap;
        src: url(/static/fonts/alegreya-latin-500-normal.woff2) format("woff2");
      }
      @font-face {
        font-family: Alegreya;
        font-style: normal;
        font-weight: 700;
        font-display: swap;
        src: url(/static/fonts/alegreya-latin-700-normal.woff2) format("woff2");
      }

      :root {
        --text: #111;
        --text-secondary: #555;
        --text-faint: #888;
        --bg: #fff;
        --bg-input: #fff;
        --accent: #2c5282;
        --accent-light: #ebf4ff;
        --green: #276d3d;
        --border: #111;
        --border-light: #e5e5e5;
      }

      @media (prefers-color-scheme: dark) {
        :root {
          --text: #e8e8e8;
          --text-secondary: #a0a0a0;
          --text-faint: #808080;
          --bg: #111;
          --bg-input: #111;
          --accent: #7db4f0;
          --accent-light: #2a3a4a;
          --green: #6ec98b;
          --border: #888;
          --border-light: #2e2e2e;
        }
      }

      *,
      *::before,
      *::after {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }
      body {
        font-family: Alegreya, Georgia, "Times New Roman", serif;
        font-size: 17px;
        line-height: 1.5;
        color: var(--text);
        background: var(--bg);
        padding: 2rem 1rem;
        min-height: 100vh;
        display: flex;
        flex-direction: column;
      }
      h1,
      h2 {
        font-weight: 500;
        line-height: 1.15;
      }
      a {
        color: var(--accent);
        text-decoration: none;
      }
      a:hover {
        text-decoration: underline;
      }
      footer {
        margin-top: 3rem;
        font-size: 0.8rem;
        color: var(--text-faint);
      }

      /* === Compositions === */

      .wrapper {
        max-width: 620px;
        margin: 0 auto;
        flex: 1;
        width: 100%;
      }
      .cluster {
        display: flex;
        flex-wrap: wrap;
        gap: var(--cluster-gap, 1rem);
        align-items: center;
      }
      .flow > * + * {
        margin-top: var(--flow-space, 1rem);
      }

      /* === Utilities === */

      .text-center {
        text-align: center;
      }
      .color-secondary {
        color: var(--text-secondary);
      }
      .color-faint {
        color: var(--text-faint);
      }
      .color-green {
        color: var(--green);
      }
      .text-s {
        font-size: 0.95rem;
      }
      .text-xs {
        font-size: 0.85rem;
      }
      .italic {
        font-style: italic;
      }
      .font-bold {
        font-weight: 700;
      }
      .font-normal {
        font-weight: 400;
      }
      .indent {
        margin-left: 1.25rem;
      }
      .sr-only {
        position: absolute;
        width: 1px;
        height: 1px;
        padding: 0;
        margin: -1px;
        overflow: hidden;
        clip: rect(0, 0, 0, 0);
        white-space: nowrap;
        border: 0;
      }

      /* === Blocks === */

      .search-form:has(.suggestions:not([hidden])) {
        border-radius: 6px 6px 0 0;
      }

      .suggestions {
        text-align: left;
        position: absolute;
        left: -1px;
        right: -1px;
        top: calc(100% + 1px);
        list-style: none;
        background: var(--bg-input);
        border: 1px solid var(--border);
        border-top: none;
        border-radius: 0 0 6px 6px;
        z-index: 10;
        overflow: hidden;
      }
      .suggestions li {
        padding: 0.25rem 0.75rem;
        cursor: pointer;
        font-size: 1rem;
      }
      .suggestions li[data-active] {
        background: var(--accent-light);
      }
      @media (hover: hover) {
        .suggestions li:hover {
          background: var(--accent-light);
        }
      }

      .search-form {
        position: relative;
        margin-bottom: 1rem;
        border: 1px solid var(--border);
        border-radius: 6px;
        background: var(--bg-input);
        --cluster-gap: 0;
      }
      .search-form:focus-within {
        border-color: var(--accent);
      }
      .search-form input[type="text"] {
        flex: 1;
        font-family: inherit;
        font-size: 1rem;
        padding: 0.4rem 0.75rem;
        border: none;
        background: none;
        color: var(--text);
        outline: none;
      }
      .search-form .clear {
        background: none;
        border: none;
        color: var(--text-faint);
        padding: 0.5rem;
        min-width: 44px;
        min-height: 44px;
        display: flex;
        align-items: center;
        justify-content: center;
        cursor: pointer;
      }
      .search-form .clear[hidden] {
        visibility: hidden;
      }
      .search-form .clear:hover {
        color: var(--text);
      }

      .hero {
        padding-top: min(20vh, 150px);
      }
      .hero h1 {
        font-size: 2.5rem;
      }
      .hero .tagline {
        margin-bottom: 1.5rem;
      }
      .hero .search-form {
        justify-content: center;
        max-width: 480px;
        margin: 0 auto;
      }

      .results-header h1 {
        font-size: 2rem;
        margin-top: 1.5rem;
        margin-bottom: 0.25rem;
      }

      .quick-defs {
        font-size: 1.05rem;
        margin-bottom: 1.5rem;
      }
      .quick-def + .quick-def::before {
        content: ", ";
      }

      .subheadword {
        font-size: 1.35rem;
        margin-top: 1.5rem;
        margin-bottom: 0.5rem;
      }

      .pos-group {
        --flow-space: 0.5rem;
        margin-bottom: 1.5rem;
      }
      .pos-label {
        font-style: italic;
        color: var(--text-secondary);
      }

      .sense > * + * {
        margin-top: 0;
      }
      .translation {
        display: flex;
        gap: 0.25ch;
      }

      .examples-section {
        --flow-space: 0.5rem;
        margin-top: 2.5rem;
      }
      .examples-section h2 {
        font-size: 1.25rem;
        font-weight: 700;
      }

      .corpus-example {
        margin-top: 0;
        padding: 0.5rem 0;
        border-top: 1px solid var(--border-light);
      }
      .corpus-example em {
        font-style: normal;
        font-weight: 700;
        color: var(--green);
      }

      .filter-tags {
        --cluster-gap: 0 0.9rem;
        font-size: 0.9rem;
        margin-bottom: 1rem;
      }

      .site-name {
        display: block;
        font-size: 1rem;
        font-weight: 700;
        color: var(--text);
        margin-bottom: 0.75rem;
      }
      .site-name:hover {
        color: var(--text-faint);
        text-decoration: none;
      }

      .error-message {
        padding: 1rem 0;
      }

      /* === Exceptions === */

      .filter-tag[data-state="active"] {
        color: var(--text);
        font-weight: 700;
      }
    </style>
  </head>
  <body>
    <div class="wrapper">{% block content %}{% endblock %}</div>
    <footer>
      Powered by <a href="https://www.spanishdict.com">SpanishDict</a>
    </footer>
    <script src="/dist/main.min.js"></script>
  </body>
</html>
